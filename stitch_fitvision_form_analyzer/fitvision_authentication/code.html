                    "spacing": {
                        "xs": "4px",
                        "gutter": "20px",

                    },
                    "fontFamily": {

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md lg:p-xl relative overflow-hidden">
<!-- Decorative Background Elements for High-Tech Vibe -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-primary/10 rounded-full blur-[150px]"></div>
<div class="absolute top-[30%] right-[15%] w-32 h-32 bg-primary/20 rounded-full blur-[80px]"></div>
<!-- Grid Overlay -->
<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIwIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjZmZmZmZmIiBzdG9wLW9wYWNpdHk9IjAuMDIiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiNmZmZmZmYiIHN0b3Atb3BhY2l0eT0iMCIvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJ1cmwoI2cpIiBzdHJva2Utd2lkdGg9IjEiLz48L3N2Zz4=')] opacity-30"></div>
</div>
<!-- Main Authentication Container (Glassmorphism) -->
<main class="relative z-10 w-full max-w-[480px] bg-surface-container-low/80 backdrop-blur-[30px] rounded-xl border border-white/10 p-lg lg:p-[40px] shadow-[0_0_40px_rgba(173,198,255,0.05)]">
<!-- Header -->
<header class="text-center mb-xl">
<h1 class="font-display-xl-mobile text-display-xl-mobile text-primary tracking-tighter mb-sm flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
                FitVision
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">Initialize Your Performance Protocol</p>
</header>
<!-- Toggle (Login / Register) -->
<div class="flex p-xs bg-surface-container-highest rounded-lg mb-lg border border-white/5">
<button class="flex-1 py-sm text-center font-label-caps text-label-caps bg-primary-container/20 text-primary rounded-[6px] border border-primary/30 shadow-[0_0_10px_rgba(173,198,255,0.2)] transition-all">Login</button>
<button class="flex-1 py-sm text-center font-label-caps text-label-caps text-outline hover:text-on-surface transition-colors rounded-[6px]">Register</button>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Email Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="email">Data Uplink (Email)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full bg-surface-dim border border-white/10 rounded-lg py-md pl-[48px] pr-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all placeholder:text-outline/50" id="email" placeholder="athlete@fitvision.pro" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs relative mb-sm">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Access Key (Password)</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Key?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full bg-surface-dim border border-white/10 rounded-lg py-md pl-[48px] pr-[48px] font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Validation State Example (Hidden by default, shown for demonstration) -->
<!-- <p class="font-label-caps text-[10px] text-error flex items-center gap-[4px] mt-xs"><span class="material-symbols-outlined text-[14px]">error</span> Invalid Access Key</p> -->
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-headline-md text-[18px] py-[14px] rounded-lg hover:bg-primary-fixed transition-all active:scale-[0.98] shadow-[0_0_20px_rgba(173,198,255,0.3)] flex justify-center items-center gap-sm mt-sm" type="submit">
                Authenticate
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-md my-sm opacity-50">
<div class="h-px bg-white/10 flex-1"></div>
<span class="font-label-caps text-label-caps text-outline">OR CONNECT VIA</span>
<div class="h-px bg-white/10 flex-1"></div>
</div>
<!-- SSO Options -->
<div class="flex gap-md">
<button class="flex-1 flex justify-center items-center gap-sm bg-surface-bright/50 border border-white/10 py-sm rounded-lg hover:bg-white/5 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">account_circle</span>
<span class="font-label-caps text-label-caps text-on-surface">Provider A</span>
</button>
<button class="flex-1 flex justify-center items-center gap-sm bg-surface-bright/50 border border-white/10 py-sm rounded-lg hover:bg-white/5 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">devices</span>
<span class="font-label-caps text-label-caps text-on-surface">Provider B</span>
</button>
</div>
</form>
<!-- AI Vision Indicator Graphic Elements -->
<div class="absolute top-0 left-0 w-[15px] h-[15px] border-t-2 border-l-2 border-primary/40 rounded-tl-lg m-sm"></div>
<div class="absolute top-0 right-0 w-[15px] h-[15px] border-t-2 border-r-2 border-primary/40 rounded-tr-lg m-sm"></div>
<div class="absolute bottom-0 left-0 w-[15px] h-[15px] border-b-2 border-l-2 border-primary/40 rounded-bl-lg m-sm"></div>
<div class="absolute bottom-0 right-0 w-[15px] h-[15px] border-b-2 border-r-2 border-primary/40 rounded-br-lg m-sm"></div>
</main>
</body></html>
