<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FITVISION - Authentication</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary-fixed-dim": "#abd600",
        "on-tertiary": "#313030",
        "surface-container-low": "#1a1c1c",
        "surface-tint": "#abd600",
        "on-secondary-container": "#b5b5b5",
        "primary-fixed": "#c3f400",
        "surface-container-lowest": "#0c0f0f",
        "on-secondary": "#303030",
        "surface-container-high": "#282a2b",
        "error-container": "#93000a",
        "surface-container": "#1e2020",
        "tertiary": "#ffffff",
        "inverse-on-surface": "#2f3131",
        "secondary": "#c6c6c6",
        "surface-bright": "#37393a",
        "primary-container": "#c3f400",
        "surface": "#121414",
        "on-error": "#690005",
        "on-primary": "#283500",
        "outline-variant": "#444933",
        "outline": "#8e9379",
        "on-error-container": "#ffdad6",
        "primary": "#ffffff",
        "error": "#ffb4ab",
        "surface-dim": "#121414",
        "surface-variant": "#333535",
        "surface-container-highest": "#333535",
        "background": "#121414",
        "on-surface": "#e2e2e2",
        "secondary-container": "#474747",
        "on-surface-variant": "#c4c9ac",
        "on-background": "#e2e2e2"
      },
      borderRadius: {
        "DEFAULT": "0px",
        "lg": "0px",
        "xl": "0px",
        "full": "0px"
      },
      spacing: {
        "unit": "4px",
        "stack-sm": "8px",
        "margin-mobile": "16px",
        "gutter": "16px",
        "stack-lg": "48px",
        "margin-desktop": "48px",
        "stack-md": "24px"
      },
      fontFamily: {
        "body-lg": ["Montserrat"],
        "label-caps": ["JetBrains Mono"],
        "display-lg": ["Bebas Neue"],
        "headline-md": ["Bebas Neue"],
        "body-md": ["Montserrat"],
        "headline-lg": ["Bebas Neue"],
        "stat-value": ["Bebas Neue"]
      },
      fontSize: {
        "body-lg": ["18px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }],
        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "700" }],
        "display-lg": ["84px", { lineHeight: "80px", letterSpacing: "0.02em", fontWeight: "700" }],
        "headline-md": ["32px", { lineHeight: "32px", letterSpacing: "0.04em", fontWeight: "700" }],
        "body-md": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }],
        "headline-lg": ["48px", { lineHeight: "48px", letterSpacing: "0.04em", fontWeight: "700" }],
        "stat-value": ["24px", { lineHeight: "24px", letterSpacing: "0.05em", fontWeight: "400" }]
      }
    }
  }
}
</script>
<style>
  .hard-shadow { box-shadow: 4px 4px 0px 0px var(--tw-shadow-color); }
  .hard-shadow-lg { box-shadow: 8px 8px 0px 0px var(--tw-shadow-color); }
  .texture-concrete::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/></svg>');
    pointer-events: none;
    z-index: 0;
  }
  .texture-grid {
    background-size: 24px 24px;
    background-image: linear-gradient(to right, rgba(51, 53, 53, 0.15) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(51, 53, 53, 0.15) 1px, transparent 1px);
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 15px rgba(195, 244, 0, 0.2); }
    50% { box-shadow: 0 0 30px rgba(195, 244, 0, 0.4); }
  }
  @keyframes scan-line {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }
  .scan-effect::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #c3f400, transparent);
    animation: scan-line 3s linear infinite;
    opacity: 0.3;
  }
</style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center p-margin-mobile relative overflow-hidden texture-grid">

<!-- Background Effects -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
  <div class="absolute top-[-30%] left-[-20%] w-[50%] h-[50%] bg-primary-fixed/5 blur-[150px]"></div>
  <div class="absolute bottom-[-30%] right-[-20%] w-[50%] h-[50%] bg-primary-fixed/3 blur-[150px]"></div>
</div>

<!-- Auth Card -->
<main class="relative z-10 w-full max-w-[520px] bg-surface-container-lowest border-2 border-surface-variant shadow-[8px_8px_0px_0px_#1a1c1c] overflow-hidden texture-concrete scan-effect">

  <!-- Header -->
  <div class="relative z-10 border-b-2 border-surface-variant bg-surface-container-low p-stack-md px-margin-desktop">
    <div class="flex items-center gap-stack-sm mb-stack-sm">
      <div class="w-12 h-12 border-2 border-primary-fixed flex items-center justify-center bg-surface">
        <span class="material-symbols-outlined text-primary-fixed text-[28px]" style="font-variation-settings:'FILL' 1;">fitness_center</span>
      </div>
      <div>
        <h1 class="font-headline-md text-headline-md italic tracking-tighter text-primary-fixed uppercase leading-none">FITVISION</h1>
        <p class="font-label-caps text-label-caps uppercase text-secondary tracking-widest mt-unit">ELITE PERFORMANCE</p>
      </div>
    </div>
    <p class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Initialize Your Performance Protocol</p>
  </div>

  <!-- Tab Toggle -->
  <div class="relative z-10 flex border-b-2 border-surface-variant">
    <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-3 font-label-caps text-label-caps uppercase tracking-wider bg-primary-container text-on-primary border-b-4 border-primary-fixed transition-all">
      LOGIN
    </button>
    <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-3 font-label-caps text-label-caps uppercase tracking-wider text-secondary hover:text-primary-fixed border-b-4 border-transparent transition-all">
      REGISTER
    </button>
  </div>

  <!-- Error display -->
  <div id="auth-error" class="hidden relative z-10 mx-6 mt-4 px-4 py-3 bg-error-container border-2 border-error text-on-error-container font-label-caps text-label-caps flex items-center gap-stack-sm">
    <span class="material-symbols-outlined text-[16px]">error</span>
    <span id="auth-error-text"></span>
  </div>

  <div class="relative z-10 p-6 md:p-margin-desktop">
    <!-- Login Form -->
    <form id="login-form" class="flex flex-col gap-stack-md" onsubmit="handleLogin(event)">
      <div class="flex flex-col gap-unit">
        <label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider" for="login-username">USERNAME</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[20px]">person</span>
          <input class="w-full bg-surface border-2 border-surface-variant py-3 pl-11 pr-4 font-label-caps text-label-caps text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-secondary-container" id="login-username" placeholder="ENTER_USERNAME" type="text" required/>
        </div>
      </div>
      <div class="flex flex-col gap-unit">
        <label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider" for="login-password">ACCESS KEY</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[20px]">lock</span>
          <input class="w-full bg-surface border-2 border-surface-variant py-3 pl-11 pr-11 font-label-caps text-label-caps text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-secondary-container" id="login-password" placeholder="••••••••" type="password" required/>
          <button class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-primary-fixed transition-colors" type="button" onclick="togglePw('login-password')">
            <span class="material-symbols-outlined text-[20px]">visibility</span>
          </button>
        </div>
      </div>
      <button id="login-btn" class="w-full bg-primary-fixed text-on-primary font-headline-md text-headline-md uppercase py-4 mt-stack-sm border-2 border-primary-fixed shadow-[4px_4px_0px_0px_#000] hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-[2px_2px_0px_0px_#000] transition-all active:scale-[0.98] flex justify-center items-center gap-stack-sm" type="submit">
        AUTHENTICATE <span class="material-symbols-outlined text-[24px]">arrow_forward</span>
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="hidden flex flex-col gap-stack-md" onsubmit="handleRegister(event)">
      <div class="flex flex-col gap-unit">
        <label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">FULL NAME</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[20px]">badge</span>
          <input class="w-full bg-surface border-2 border-surface-variant py-3 pl-11 pr-4 font-label-caps text-label-caps text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-secondary-container" id="reg-name" placeholder="ATHLETE_NAME" type="text"/>
        </div>
      </div>
      <div class="flex flex-col gap-unit">
        <label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">USERNAME</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[20px]">person</span>
          <input class="w-full bg-surface border-2 border-surface-variant py-3 pl-11 pr-4 font-label-caps text-label-caps text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-secondary-container" id="reg-username" placeholder="ATHLETE_01" type="text" required/>
        </div>
      </div>
      <div class="flex flex-col gap-unit">
        <label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">DATA UPLINK (EMAIL)</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[20px]">mail</span>
          <input class="w-full bg-surface border-2 border-surface-variant py-3 pl-11 pr-4 font-label-caps text-label-caps text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-secondary-container" id="reg-email" placeholder="ATHLETE@FITVISION.PRO" type="email" required/>
        </div>
      </div>
      <div class="flex flex-col gap-unit">
        <label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">ACCESS KEY (PASSWORD)</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[20px]">lock</span>
          <input class="w-full bg-surface border-2 border-surface-variant py-3 pl-11 pr-11 font-label-caps text-label-caps text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-secondary-container" id="reg-password" placeholder="••••••••" type="password" required minlength="6"/>
          <button class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-primary-fixed transition-colors" type="button" onclick="togglePw('reg-password')">
            <span class="material-symbols-outlined text-[20px]">visibility</span>
          </button>
        </div>
      </div>
      <button class="w-full bg-primary-fixed text-on-primary font-headline-md text-headline-md uppercase py-4 mt-stack-sm border-2 border-primary-fixed shadow-[4px_4px_0px_0px_#000] hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-[2px_2px_0px_0px_#000] transition-all active:scale-[0.98] flex justify-center items-center gap-stack-sm" type="submit">
        CREATE PROTOCOL <span class="material-symbols-outlined text-[24px]">arrow_forward</span>
      </button>
    </form>
  </div>

  <!-- Corner indicators -->
  <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-primary-fixed m-1 z-20"></div>
  <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-primary-fixed m-1 z-20"></div>
  <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-primary-fixed m-1 z-20"></div>
  <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-primary-fixed m-1 z-20"></div>
</main>

<script src="/static/js/api.js"></script>
<script>
if (API.isLoggedIn()) window.location.href = '/dashboard';

function switchTab(tab) {
  const errEl = document.getElementById('auth-error');
  errEl.classList.add('hidden');
  if (tab === 'login') {
    document.getElementById('login-form').classList.remove('hidden');
    document.getElementById('register-form').classList.add('hidden');
    document.getElementById('tab-login').className = 'flex-1 py-3 font-label-caps text-label-caps uppercase tracking-wider bg-primary-container text-on-primary border-b-4 border-primary-fixed transition-all';
    document.getElementById('tab-register').className = 'flex-1 py-3 font-label-caps text-label-caps uppercase tracking-wider text-secondary hover:text-primary-fixed border-b-4 border-transparent transition-all';
  } else {
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('register-form').classList.remove('hidden');
    document.getElementById('tab-register').className = 'flex-1 py-3 font-label-caps text-label-caps uppercase tracking-wider bg-primary-container text-on-primary border-b-4 border-primary-fixed transition-all';
    document.getElementById('tab-login').className = 'flex-1 py-3 font-label-caps text-label-caps uppercase tracking-wider text-secondary hover:text-primary-fixed border-b-4 border-transparent transition-all';
  }
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  document.getElementById('auth-error-text').textContent = msg;
  el.classList.remove('hidden');
}

function togglePw(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

async function handleLogin(e) {
  e.preventDefault();
  try {
    await API.login(document.getElementById('login-username').value, document.getElementById('login-password').value);
    window.location.href = '/dashboard';
  } catch (err) { showError(err.message); }
}

async function handleRegister(e) {
  e.preventDefault();
  try {
    await API.register(
      document.getElementById('reg-email').value,
      document.getElementById('reg-username').value,
      document.getElementById('reg-password').value,
      document.getElementById('reg-name').value
    );
    await API.login(document.getElementById('reg-username').value, document.getElementById('reg-password').value);
    window.location.href = '/dashboard';
  } catch (err) { showError(err.message); }
}
</script>
</body></html>
